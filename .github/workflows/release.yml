name: Release-plz

permissions:
  pull-requests: write
  contents: write

on:
  push:
    branches:
      - main

jobs:
  release-plz:
    name: Release-plz
    runs-on: ubuntu-22.04
    steps:
      # Generating a GitHub token, so that PRs and tags created by
      # the release-plz-action can trigger actions workflows.
      - name: Generate GitHub token
        uses: tibdex/github-app-token@v2
        id: generate-token
        with:
          app_id: ${{ secrets.APP_ID }}
          private_key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.generate-token.outputs.token }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install needed Ubuntu Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config libudev-dev
      - name: clear cache
        run: cargo clean
      - name: Run release-plz
        uses: MarcoIeni/release-plz-action@main
        with:
          # TEMPORARY bootstrap for the repo split: run only `release-plz release`
          # (publish + tag), skipping `release-pr`. release-pr walks git history
          # comparing against the crates.io packages published from the old
          # monorepo, and dies at pre-split commits whose filtered trees have
          # unbuildable manifests. Publishing 0.0.11/0.0.9/0.0.22 from this repo
          # anchors future walks at the bump commit (package equality + tag +
          # .cargo_vcs_info.json sha). Remove this block after the bootstrap
          # release succeeds.
          command: release
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
