version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor:
        update-types:
          - minor
          - patch

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # soroban-cli/soroban-sdk pin exact stellar-strkey/xdr versions, so these must move together.
      stellar:
        patterns:
          - "soroban-*"
          - "stellar-*"
      cargo-minor:
        update-types:
          - minor
          - patch
