[workspace]
resolver = "2"
default-members = ["crates/*"]
members = ["crates/*", "crates/stellar-registry-test/fixtures/contracts/*"]

[workspace.package]
repository = "https://github.com/stellar-registry/cli"

[workspace.dependencies]
# Local crates
stellar-registry = { path = "crates/stellar-registry" }
stellar-registry-test = { path = "crates/stellar-registry-test" }
stellar-registry-macro = { path = "crates/stellar-registry-macro" }
stellar-registry-build = { path = "crates/stellar-registry-build" }

# Cross-repo deps from scaffold-stellar/cli (crates.io for published libs,
# git for stellar-scaffold-test which is `publish = false`).
stellar-build = "0.0.6"
stellar-scaffold-macro = "0.8.14"

stellar-cli = { version = "27.0.0", package = "soroban-cli", default-features = false }
soroban-rpc = { package = "stellar-rpc-client", version = "27.0.0" }
soroban-sdk = { version = "27.0.0-rc.1" }
soroban-spec-tools = "27.0.0"

admin-sep = { git = "https://github.com/theahaco/admin-sep", rev = "c4624cc742913a16095084e3149e241405882849" }
stellar-xdr = "=27.0.0"
stellar-strkey = "0.0.16"

proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2", features = ["full"] }

cargo_metadata = "0.18.1"
thiserror = "2.0.17"
sha2 = "0.10.9"

clap = "4.6.1"
reqwest = { version = "0.12.9", default-features = false }

[workspace.lints.clippy]
result_large_err = "allow"

# Size-optimized profile for building test-fixture contracts (hello_v1/v2) to
# wasm via `stellar contract build --profile contracts`. Mirrors the profile in
# stellar-registry/contracts so fixtures build the same way as the registry.
[profile.contracts]
inherits = "release"
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = true
