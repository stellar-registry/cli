[package]
name = "unverified_caller"
version = "0.0.0"
edition = "2024"
publish = false

# Imports `unverified`, which only resolves on testnet, so it can't be a
# workspace member. Run with `just test-register-import-testnet`.
[workspace]

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
soroban-sdk = "28.0.0"
stellar-registry = { path = "../../../../stellar-registry" }

[dev-dependencies]
soroban-sdk = { version = "28.0.0", features = ["testutils"] }
stellar-registry = { path = "../../../../stellar-registry", features = ["testutils"] }
