[package]
name = "stellar-registry-macro"
version = "0.0.1"
edition = "2024"
description = "The import_contract! macro for the Stellar Registry"
license = "Apache-2.0"
repository.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true }
stellar-build = { workspace = true }
# name types only — the workspace pins default-features = false so this
# proc-macro never drags the stellar-cli stack into consumer contract builds.
stellar-registry-build = { workspace = true }
stellar-strkey = { workspace = true }
stellar-xdr = { workspace = true }
sha2 = { workspace = true }

[lints]
workspace = true
