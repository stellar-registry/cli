[package]
name = "stellar-registry-build"
version = "0.0.9"
edition = "2024"
description = "A library using the registry at build time"
license = "Apache-2.0"
repository = "https://github.com/stellar-registry/cli/tree/main/crates/stellar-registry-build"


[lib]
crate-type = ["rlib"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["cli"]
# Network-facing registry access (contract, registry, error modules). Off, the
# crate is just the dependency-light `name` module — what proc-macro consumers
# want, so they don't drag the stellar-cli stack into every contract build.
cli = [
    "dep:sha2",
    "dep:soroban-rpc",
    "dep:stellar-build",
    "dep:stellar-cli",
    "dep:stellar-strkey",
]

[dependencies]
stellar-cli = { workspace = true, optional = true, default-features = false, features = [] }
stellar-build = { workspace = true, optional = true }
stellar-registry-name = { workspace = true }

soroban-rpc = { workspace = true, optional = true }
stellar-strkey = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }

thiserror = "2.0.17"
semver = "1.0.28"

[dev-dependencies]
expect-test = "1.5"
