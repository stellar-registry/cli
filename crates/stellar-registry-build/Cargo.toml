[package]
name = "stellar-registry-build"
version = "0.0.9"
edition = "2024"
description = "A library using the registry at build time"
license = "Apache-2.0"
repository = "https://github.com/stellar-registry/cli/tree/main/crates/stellar-registry-build"


[lib]
crate-type = ["rlib"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
stellar-cli = { workspace = true, default-features = false, features = [] }
stellar-build = { workspace = true }
stellar-registry-name = { workspace = true }

soroban-rpc = { workspace = true }
stellar-strkey = { workspace = true }
sha2 = { workspace = true }

thiserror = "2.0.17"
semver = "1.0.28"

[dev-dependencies]
expect-test = "1.5"
